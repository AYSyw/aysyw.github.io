<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
    <title>射击练习小游戏</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%; overflow: hidden; background: #000;
            font-family: 'Inter', 'Segoe UI', Roboto, system-ui, sans-serif; touch-action: none;
            display: flex; align-items: center; justify-content: center;
        }
        .game-wrapper { position: relative; width: 100vw; height: 100vh; background: #0a0e14; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; background: radial-gradient(circle at 30% 20%, #1e2a3a, #0a0e14); touch-action: none; cursor: crosshair; }
        canvas.locked { cursor: none; }

        .hud-top {
            position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 16px; padding: 8px 24px;
            background: rgba(10, 16, 24, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-radius: 100px; border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            pointer-events: none; z-index: 20; white-space: nowrap;
        }
        .hud-item { display: flex; align-items: center; gap: 8px; color: #e8f0f8; font-weight: 600; font-size: 1rem; letter-spacing: 0.3px; }
        .hud-item .label { opacity: 0.6; font-weight: 500; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.8px; }
        .hud-item .value { font-weight: 800; font-size: 1.2rem; color: #ffd966; text-shadow: 0 0 12px rgba(255, 200, 50, 0.4); font-variant-numeric: tabular-nums; }
        .hud-divider { width: 1px; height: 24px; background: rgba(255, 255, 255, 0.15); }
        .hud-item .value.white { color: #e8f0f8; text-shadow: none; }
        .hint-text {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: rgba(200, 220, 240, 0.5); font-size: 0.8rem; font-weight: 400; letter-spacing: 0.5px;
            pointer-events: none; z-index: 10; text-shadow: 0 2px 8px rgba(0,0,0,0.8); white-space: nowrap;
        }
        @media (max-width: 700px) {
            .hud-top { top: 10px; gap: 10px; padding: 6px 16px; }
            .hud-item { font-size: 0.85rem; gap: 5px; }
            .hud-item .label { font-size: 0.7rem; }
            .hud-item .value { font-size: 1rem; }
            .hint-text { font-size: 0.7rem; bottom: 12px; }
        }
    </style>
</head>
<body>
<div class="game-wrapper" id="gameWrapper">
    <canvas id="gameCanvas" width="2560" height="1660"></canvas>
    <div class="hud-top">
        <div class="hud-item"><span class="label">得分</span><span class="value" id="scoreDisplay">0</span></div>
        <div class="hud-divider"></div>
        <div class="hud-item"><span class="label">靶子</span><span class="value white" id="targetCountDisplay">0/1</span></div>
        <div class="hud-divider"></div>
        <div class="hud-item"><span class="label">时间</span><span class="value white" id="timeDisplay">0s</span></div>
    </div>
    <div class="hint-text" id="hintText">🎯 拖动屏幕移动视角 · 点击开火</div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', function() {
        const canvas = document.getElementById('gameCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');
        const targetCountSpan = document.getElementById('targetCountDisplay');
        const timeSpan = document.getElementById('timeDisplay');
        const hintText = document.getElementById('hintText');

        const CANVAS_W = 2560, CANVAS_H = 1660;
        canvas.width = CANVAS_W; canvas.height = CANVAS_H;

        const hasCoarse = window.matchMedia('(pointer: coarse)').matches;
        const hasFine = window.matchMedia('(pointer: fine)').matches;
        const hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        const isTouchDevice = hasTouch && (hasCoarse || !hasFine);
        if (!isTouchDevice) hintText.textContent = '🎯 点击画布锁定鼠标 · 移动鼠标转视角 · 左键开火 · 右键开镜 · R换弹 · ESC解锁';

        const ZOOM_SCALE = 2.0;
        let score = 0, isZoomed = false, cameraYaw = 0, cameraPitch = 0;
        const SENSITIVITY = 2;
        let targets = [], spawnTimer = 0, nextSpawnInterval = 2.5, maxTargets = 1, targetSpeedMultiplier = 1.0;
        let fireCooldown = 0, recoil = 0;
        const FIRE_COOLDOWN_FRAMES = 10, TARGET_RADIUS = 100;
        const TARGET_SPEED_MIN = 2.0, TARGET_SPEED_MAX = 6.5;
        const CROSSHAIR_X = CANVAS_W/2, CROSSHAIR_Y = CANVAS_H/2;

        const MAGAZINE_SIZE = 6;
        let ammo = MAGAZINE_SIZE, isReloading = false, reloadProgress = 0, reloadTimer = 0;
        const RELOAD_DURATION = 1.0;

        const reloadBtnX = CANVAS_W - 240, reloadBtnY = CANVAS_H - 1000, reloadBtnR = 110;
        const fireBtnX = CANVAS_W - 240, fireBtnY = CANVAS_H - 280, fireBtnR = 140;
        const zoomBtnX = CANVAS_W - 240, zoomBtnY = CANVAS_H - 640, zoomBtnR = 115;
        const gunBaseX = CANVAS_W - 160, gunBaseY = CANVAS_H - 30, gunAngle = -Math.PI * 0.65;

        const activeTouches = new Map();
        let isPointerLocked = false, pendingMouseDX = 0, pendingMouseDY = 0;
        let lastTimestamp = 0, elapsedRealSeconds = 0;

        function resizeCanvas() { canvas.style.width = '100%'; canvas.style.height = '100%'; }
        window.addEventListener('resize', resizeCanvas);

        function random(min, max) { return Math.random() * (max - min) + min; }
        function worldToScreen(wx, wy) { return { x: wx - cameraYaw, y: wy - cameraPitch }; }
        function screenToWorld(sx, sy) { return { x: sx + cameraYaw, y: sy + cameraPitch }; }

        function createTarget() {
            const r = TARGET_RADIUS;
            const vwx = cameraYaw + CANVAS_W/2, vwy = cameraPitch + CANVAS_H/2;
            const sr = random(900, 1600), ang = random(0, Math.PI*2);
            let x = vwx + Math.cos(ang)*sr, y = vwy + Math.sin(ang)*sr;
            let attempts = 0, overlap = true;
            while (overlap && attempts < 30) {
                overlap = false;
                for (let t of targets) if (Math.hypot(x-t.x, y-t.y) < r*2.6) { overlap = true; break; }
                if (overlap) { const na = random(0,Math.PI*2), nr = random(900,1600); x = vwx + Math.cos(na)*nr; y = vwy + Math.sin(na)*nr; }
                attempts++;
            }
            const ma = random(0, Math.PI*2), sp = random(TARGET_SPEED_MIN, TARGET_SPEED_MAX)*targetSpeedMultiplier;
            return { x, y, vx: Math.cos(ma)*sp, vy: Math.sin(ma)*sp, r, pulse: random(0,Math.PI*2), age: 0 };
        }

        function updateTargets(ds) {
            const sf = ds*60, vwx = cameraYaw + CANVAS_W/2, vwy = cameraPitch + CANVAS_H/2;
            for (let i = targets.length-1; i >= 0; i--) {
                const t = targets[i];
                t.age++; t.x += t.vx*sf; t.y += t.vy*sf; t.pulse += 0.07*sf;
                if (Math.random() < 0.01) { const a = Math.atan2(t.vy,t.vx)+random(-0.5,0.5), s = Math.hypot(t.vx,t.vy); t.vx = Math.cos(a)*s; t.vy = Math.sin(a)*s; }
                if (Math.hypot(t.x-vwx, t.y-vwy) > 4000) targets.splice(i,1);
            }
        }

        function updateDifficulty(es) {
            if (es < 60) { const p = es/60; maxTargets = 1 + Math.floor(p*2); nextSpawnInterval = 2.5 - p*0.8; targetSpeedMultiplier = 1 + p*0.2; }
            else { const e = Math.min((es-60)/60, 1.5); maxTargets = Math.min(3 + Math.floor(e*3), 7); nextSpawnInterval = Math.max(0.6, 1.7 - e*0.5); targetSpeedMultiplier = 1.2 + e*0.5; }
        }

        function drawBackground() {
            ctx.fillStyle = '#0f151d'; ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
            const g = ctx.createRadialGradient(CANVAS_W/2,CANVAS_H/2,400,CANVAS_W/2,CANVAS_H/2,2400);
            g.addColorStop(0,'#1e2f42'); g.addColorStop(0.8,'#0a0e14');
            ctx.fillStyle = g; ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
            const gs = 160, ox = ((-cameraYaw)%gs+gs)%gs, oy = ((-cameraPitch)%gs+gs)%gs;
            ctx.strokeStyle = '#3a4f66'; ctx.lineWidth = 3; ctx.globalAlpha = 0.15;
            for (let i = -gs; i < CANVAS_W+gs; i += gs) { ctx.beginPath(); ctx.moveTo(i+ox,0); ctx.lineTo(i+ox,CANVAS_H); ctx.stroke(); }
            for (let i = -gs; i < CANVAS_H+gs; i += gs) { ctx.beginPath(); ctx.moveTo(0,i+oy); ctx.lineTo(CANVAS_W,i+oy); ctx.stroke(); }
            ctx.globalAlpha = 1.0;
        }

        function drawTarget(t) {
            const s = worldToScreen(t.x,t.y), cx = s.x, cy = s.y, r = t.r;
            if (cx+r < -500 || cx-r > CANVAS_W+500 || cy+r < -500 || cy-r > CANVAS_H+500) return;
            const gl = Math.sin(t.pulse)*0.1+0.9;
            ctx.shadowColor = '#ffaa33'; ctx.shadowBlur = 70*gl;
            ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle = '#141414'; ctx.fill();
            ctx.shadowBlur = 0;
            const rings = [{r,c:'#2a2a2a'},{r:r*0.85,c:'#1e4a6e'},{r:r*0.7,c:'#8a2222'},{r:r*0.55,c:'#c49a1a'},{r:r*0.4,c:'#e8e8e8'}];
            for (let ring of rings) { ctx.beginPath(); ctx.arc(cx,cy,ring.r,0,Math.PI*2); ctx.fillStyle = ring.c; ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 6; ctx.stroke(); }
            ctx.beginPath(); ctx.arc(cx,cy,r*0.1,0,Math.PI*2); ctx.fillStyle = '#fff9e6'; ctx.shadowBlur = 50; ctx.shadowColor = '#ffdd88'; ctx.fill(); ctx.shadowBlur = 0;
        }

        function drawGun() {
            ctx.save(); ctx.translate(gunBaseX, gunBaseY); ctx.rotate(gunAngle);
            const ro = recoil*50;
            ctx.beginPath(); ctx.ellipse(-40,40,70,130,0.2,0,Math.PI*2); ctx.fillStyle = '#1a1f26'; ctx.fill(); ctx.strokeStyle = '#34404d'; ctx.lineWidth = 12; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-70,-20); ctx.lineTo(390-ro,-70); ctx.lineTo(390-ro,70); ctx.lineTo(-70,95); ctx.closePath(); ctx.fillStyle = '#252c35'; ctx.fill(); ctx.strokeStyle = '#4a5c70'; ctx.lineWidth = 9; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(330-ro,-46); ctx.lineTo(620-ro,-23); ctx.lineTo(620-ro,23); ctx.lineTo(330-ro,46); ctx.closePath(); ctx.fillStyle = '#1e242b'; ctx.fill(); ctx.strokeStyle = '#5a6f85'; ctx.lineWidth = 7; ctx.stroke();
            ctx.beginPath(); ctx.arc(628-ro,0,22,0,Math.PI*2); ctx.fillStyle = '#6a7b8c'; ctx.shadowBlur = 40; ctx.shadowColor = '#aac8ff'; ctx.fill(); ctx.strokeStyle = '#b0d0ff'; ctx.lineWidth = 6; ctx.stroke(); ctx.shadowBlur = 0;
            if (fireCooldown > FIRE_COOLDOWN_FRAMES*0.5) {
                const inten = (fireCooldown - FIRE_COOLDOWN_FRAMES*0.5)/(FIRE_COOLDOWN_FRAMES*0.5);
                ctx.shadowBlur = 120; ctx.shadowColor = '#ffaa33';
                ctx.beginPath(); ctx.moveTo(640-ro,0); ctx.lineTo(780-ro,-65); ctx.lineTo(900-ro,0); ctx.lineTo(780-ro,65); ctx.closePath(); ctx.fillStyle = `rgba(255,200,50,${inten*0.9})`; ctx.fill();
                ctx.fillStyle = `rgba(255,100,20,${inten*0.7})`; ctx.beginPath(); ctx.arc(740-ro,0,60*inten,0,Math.PI*2); ctx.fill();
            }
            ctx.restore();
        }

        function drawCrosshair() {
            const x = CROSSHAIR_X, y = CROSSHAIR_Y;
            ctx.save();
            ctx.strokeStyle = isZoomed ? '#8affc1' : 'rgba(255,255,255,0.9)';
            ctx.lineWidth = isZoomed ? 11 : 8; ctx.shadowBlur = 50; ctx.shadowColor = isZoomed ? '#00ffaa' : '#ffffff';
            const gap = isZoomed ? 55 : 38, len = isZoomed ? 100 : 70;
            ctx.beginPath(); ctx.moveTo(x-gap-len,y); ctx.lineTo(x-gap,y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x+gap,y); ctx.lineTo(x+gap+len,y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x,y-gap-len); ctx.lineTo(x,y-gap); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x,y+gap); ctx.lineTo(x,y+gap+len); ctx.stroke();
            ctx.beginPath(); ctx.arc(x,y,isZoomed?14:10,0,Math.PI*2); ctx.fillStyle = isZoomed ? '#b3ffd9' : '#ffffff'; ctx.shadowBlur = 60; ctx.fill();
            if (isZoomed) { ctx.beginPath(); ctx.arc(x,y,200,0,Math.PI*2); ctx.strokeStyle = 'rgba(160,255,200,0.5)'; ctx.lineWidth = 10; ctx.setLineDash([30,45]); ctx.stroke(); ctx.setLineDash([]); }
            ctx.restore();
        }

        function drawAmmoDisplay() {
            ctx.save();
            ctx.font = 'bold 44px "Inter", monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            ctx.shadowBlur = 20; ctx.shadowColor = '#000';
            ctx.fillStyle = isReloading ? '#ffaa33' : (ammo > 0 ? '#e8f0f8' : '#ff5555');
            ctx.fillText(`🔫 ${ammo} / ${MAGAZINE_SIZE}`, 60, CANVAS_H - 80);
            if (isReloading) { ctx.font = 'bold 28px "Inter", sans-serif'; ctx.fillStyle = '#ffaa33'; ctx.fillText('换弹中...', 60, CANVAS_H - 130); }
            ctx.restore();
        }

        function drawReloadButton() {
            if (!isTouchDevice) return;
            const x = reloadBtnX, y = reloadBtnY, r = reloadBtnR;
            ctx.save();
            ctx.shadowBlur = 60; ctx.shadowColor = isReloading ? '#ffaa33' : '#4488aa';
            ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle = isReloading ? 'rgba(120,80,20,0.8)' : 'rgba(35,55,75,0.75)'; ctx.fill();
            ctx.strokeStyle = isReloading ? 'rgba(255,200,80,0.9)' : 'rgba(120,160,200,0.7)'; ctx.lineWidth = 9; ctx.stroke();
            if (isReloading) {
                const sa = -Math.PI/2, ea = sa + (Math.PI*2)*reloadProgress;
                ctx.beginPath(); ctx.arc(x,y,r+18,sa,ea); ctx.strokeStyle = '#ffd966'; ctx.lineWidth = 14; ctx.lineCap = 'round'; ctx.shadowBlur = 30; ctx.shadowColor = '#ffaa00'; ctx.stroke();
                ctx.beginPath(); ctx.arc(x,y,r+18,ea,sa+Math.PI*2); ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 14; ctx.lineCap = 'round'; ctx.shadowBlur = 0; ctx.stroke();
            }
            ctx.shadowBlur = 20; ctx.shadowColor = isReloading ? '#ffcc66' : '#88bbdd';
            ctx.fillStyle = isReloading ? '#ffdd99' : '#d0e4f8'; ctx.strokeStyle = isReloading ? '#ffcc66' : '#88bbdd'; ctx.lineWidth = 5;
            const cw = r*0.55, ch = r*0.8;
            ctx.save(); ctx.translate(x,y); ctx.rotate(-0.2);
            ctx.beginPath(); ctx.rect(-cw/2,-ch/2,cw,ch); ctx.fill(); ctx.stroke();
            ctx.beginPath(); for (let i = 1; i <= 3; i++) { const yy = -ch/2 + (ch*i/4); ctx.moveTo(-cw/2+8,yy); ctx.lineTo(cw/2-8,yy); }
            ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 3; ctx.stroke();
            ctx.beginPath(); ctx.rect(-cw/2+6,-ch/2-6,cw-12,8); ctx.fillStyle = isReloading ? '#ffdd99' : '#d0e4f8'; ctx.fill();
            ctx.restore(); ctx.restore();
        }

        function drawFireButton() {
            if (!isTouchDevice) return;
            const x = fireBtnX, y = fireBtnY, r = fireBtnR, p = fireCooldown > FIRE_COOLDOWN_FRAMES*0.7;
            ctx.save();
            ctx.shadowBlur = 80; ctx.shadowColor = '#ff3333';
            ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle = p ? 'rgba(200,45,45,0.85)' : 'rgba(60,22,22,0.7)'; ctx.fill();
            ctx.strokeStyle = p ? 'rgba(255,140,140,0.9)' : 'rgba(170,68,68,0.7)'; ctx.lineWidth = 10; ctx.stroke();
            ctx.shadowBlur = 50; ctx.shadowColor = '#ff9966';
            ctx.beginPath(); ctx.arc(x,y,r*0.58,0,Math.PI*2); ctx.fillStyle = p ? 'rgba(255,180,70,0.9)' : 'rgba(160,85,40,0.7)'; ctx.fill();
            ctx.strokeStyle = 'rgba(255,220,150,0.6)'; ctx.lineWidth = 6; ctx.stroke();
            ctx.beginPath(); ctx.arc(x,y,r*0.2,0,Math.PI*2); ctx.fillStyle = '#fff5e6'; ctx.shadowBlur = 60; ctx.shadowColor = '#ffaa00'; ctx.fill();
            ctx.beginPath(); ctx.moveTo(x-34,y-38); ctx.lineTo(x+48,y); ctx.lineTo(x-34,y+38); ctx.closePath(); ctx.fillStyle = '#fff9ef'; ctx.shadowBlur = 50; ctx.shadowColor = '#ffaa00'; ctx.fill();
            ctx.restore();
        }

        function drawZoomButton() {
            if (!isTouchDevice) return;
            const x = zoomBtnX, y = zoomBtnY, r = zoomBtnR;
            ctx.save();
            ctx.shadowBlur = 60; ctx.shadowColor = isZoomed ? '#00ffaa' : '#4488bb';
            ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle = isZoomed ? 'rgba(30,100,65,0.8)' : 'rgba(35,55,75,0.75)'; ctx.fill();
            ctx.strokeStyle = isZoomed ? 'rgba(120,255,190,0.8)' : 'rgba(120,160,200,0.7)'; ctx.lineWidth = 9; ctx.stroke();
            ctx.shadowBlur = 30; ctx.shadowColor = isZoomed ? '#88ffcc' : '#88bbdd';
            const cg = r*0.42, cl = r*0.36;
            ctx.strokeStyle = isZoomed ? '#ccffee' : '#e0eeff'; ctx.lineWidth = 8;
            ctx.beginPath(); ctx.moveTo(x-cg-cl,y); ctx.lineTo(x-cg,y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x+cg,y); ctx.lineTo(x+cg+cl,y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x,y-cg-cl); ctx.lineTo(x,y-cg); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x,y+cg); ctx.lineTo(x,y+cg+cl); ctx.stroke();
            ctx.beginPath(); ctx.arc(x,y,r*0.1,0,Math.PI*2); ctx.fillStyle = isZoomed ? '#ccffee' : '#e0eeff'; ctx.fill();
            ctx.restore();
        }

        function drawZoomVignette() {
            if (!isZoomed) return;
            ctx.save(); ctx.beginPath(); ctx.rect(0,0,CANVAS_W,CANVAS_H); ctx.clip();
            const v = ctx.createRadialGradient(CROSSHAIR_X,CROSSHAIR_Y,700,CROSSHAIR_X,CROSSHAIR_Y,2600);
            v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,15,8,0.7)'); ctx.fillStyle = v; ctx.fillRect(0,0,CANVAS_W,CANVAS_H); ctx.restore();
        }

        function updateHUD() {
            scoreSpan.textContent = score;
            targetCountSpan.textContent = targets.length + '/' + maxTargets;
            timeSpan.textContent = Math.floor(elapsedRealSeconds) + 's';
        }

        function draw() {
            ctx.clearRect(0,0,CANVAS_W,CANVAS_H);
            ctx.save();
            if (isZoomed) { ctx.translate(CROSSHAIR_X,CROSSHAIR_Y); ctx.scale(ZOOM_SCALE,ZOOM_SCALE); ctx.translate(-CROSSHAIR_X,-CROSSHAIR_Y); }
            drawBackground(); for (let t of targets) drawTarget(t); ctx.restore();
            drawGun(); drawCrosshair(); drawAmmoDisplay(); drawFireButton(); drawZoomButton(); drawReloadButton(); drawZoomVignette();
            if (!isTouchDevice && !isPointerLocked) {
                ctx.save(); ctx.font = 'bold 60px "Inter", sans-serif'; ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0,CANVAS_H/2-120,CANVAS_W,240);
                ctx.fillStyle = '#ffffff'; ctx.shadowBlur = 20; ctx.shadowColor = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('点击画面锁定鼠标', CANVAS_W/2, CANVAS_H/2 - 20);
                ctx.font = 'bold 40px "Inter", sans-serif'; ctx.fillStyle = '#aaccff';
                ctx.fillText('移动鼠标转视角 · 左键开火 · 右键开镜 · R换弹 · ESC解锁', CANVAS_W/2, CANVAS_H/2 + 60);
                ctx.restore();
            }
        }

        function startReload() { if (isReloading || ammo === MAGAZINE_SIZE) return; isReloading = true; reloadProgress = 0; reloadTimer = 0; }
        function updateReload(ds) {
            if (!isReloading) return;
            reloadTimer += ds; reloadProgress = Math.min(reloadTimer/RELOAD_DURATION, 1);
            if (reloadTimer >= RELOAD_DURATION) { ammo = MAGAZINE_SIZE; isReloading = false; reloadProgress = 0; reloadTimer = 0; }
        }

        function gameLoop(ts) {
            try {
                if (lastTimestamp === 0) { lastTimestamp = ts; requestAnimationFrame(gameLoop); return; }
                let dm = ts - lastTimestamp; lastTimestamp = ts;
                if (dm > 200) dm = 16.67; if (dm < 0) dm = 16.67;
                const ds = dm/1000; elapsedRealSeconds += ds;
                updateDifficulty(elapsedRealSeconds);
                spawnTimer += ds;
                if (targets.length < maxTargets) { if (spawnTimer >= nextSpawnInterval) { targets.push(createTarget()); spawnTimer = 0; } }
                else spawnTimer = 0;
                updateTargets(ds); updateReload(ds);
                if (fireCooldown > 0) fireCooldown--; if (recoil > 0) recoil *= 0.82;
                if (isPointerLocked && (pendingMouseDX !== 0 || pendingMouseDY !== 0)) {
                    // 左右上下都反转：移动鼠标方向与视角移动方向一致
                    cameraYaw += pendingMouseDX * SENSITIVITY;
                    cameraPitch += pendingMouseDY * SENSITIVITY;
                    pendingMouseDX = 0; pendingMouseDY = 0;
                }
                draw(); updateHUD();
            } catch(e) { console.error(e); }
            requestAnimationFrame(gameLoop);
        }

        function getTouchCoords(touch) {
            const rect = canvas.getBoundingClientRect(), sx = CANVAS_W/rect.width, sy = CANVAS_H/rect.height;
            return { x: Math.min(Math.max((touch.clientX-rect.left)*sx,0),CANVAS_W), y: Math.min(Math.max((touch.clientY-rect.top)*sy,0),CANVAS_H) };
        }

        function hitButton(x,y) {
            if (!isTouchDevice) return null;
            if (Math.hypot(x-fireBtnX,y-fireBtnY) <= fireBtnR) return 'fire';
            if (Math.hypot(x-zoomBtnX,y-zoomBtnY) <= zoomBtnR) return 'zoom';
            if (Math.hypot(x-reloadBtnX,y-reloadBtnY) <= reloadBtnR) return 'reload';
            return null;
        }

        function fire() {
            if (isReloading) return;
            if (ammo <= 0) { startReload(); return; }
            if (fireCooldown > 0) return;
            fireCooldown = FIRE_COOLDOWN_FRAMES; recoil = 1.0; ammo--;
            const wp = screenToWorld(CROSSHAIR_X,CROSSHAIR_Y);
            for (let i = targets.length-1; i >= 0; i--) {
                const t = targets[i];
                if (Math.hypot(wp.x-t.x, wp.y-t.y) <= t.r) {
                    const ratio = Math.hypot(wp.x-t.x, wp.y-t.y)/t.r;
                    let pts = 6; if (ratio <= 0.4) pts = 10; else if (ratio <= 0.55) pts = 9; else if (ratio <= 0.7) pts = 8; else if (ratio <= 0.85) pts = 7;
                    score += pts; targets.splice(i,1); break;
                }
            }
            if (ammo <= 0 && !isReloading) startReload();
        }

        function requestPointerLock() {
            if (isTouchDevice) return;
            if (canvas.requestPointerLock) canvas.requestPointerLock();
            else if (canvas.mozRequestPointerLock) canvas.mozRequestPointerLock();
            else if (canvas.webkitRequestPointerLock) canvas.webkitRequestPointerLock();
        }

        function onPointerLockChange() {
            const locked = document.pointerLockElement === canvas || document.mozPointerLockElement === canvas || document.webkitPointerLockElement === canvas;
            isPointerLocked = locked;
            if (locked) { canvas.classList.add('locked'); hintText.style.display = 'none'; }
            else { canvas.classList.remove('locked'); hintText.style.display = ''; pendingMouseDX = 0; pendingMouseDY = 0; }
        }

        function onMouseMove(e) {
            if (isTouchDevice || !isPointerLocked) return;
            e.preventDefault(); pendingMouseDX += e.movementX || 0; pendingMouseDY += e.movementY || 0;
        }

        function onMouseDown(e) {
            if (isTouchDevice) return;
            e.preventDefault();
            if (!isPointerLocked) { requestPointerLock(); return; }
            if (e.button === 0) fire(); else if (e.button === 2) isZoomed = !isZoomed;
        }

        function onKeyDown(e) { if (!isTouchDevice && (e.key === 'r' || e.key === 'R')) { startReload(); e.preventDefault(); } }

        function handleTouchStart(e) {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i], c = getTouchCoords(touch), btn = hitButton(c.x,c.y);
                if (btn === 'fire') { fire(); activeTouches.set(touch.identifier, {role:'fire', lastX:c.x, lastY:c.y}); }
                else if (btn === 'zoom') { isZoomed = !isZoomed; activeTouches.set(touch.identifier, {role:'zoom', lastX:c.x, lastY:c.y}); }
                else if (btn === 'reload') { startReload(); activeTouches.set(touch.identifier, {role:'reload', lastX:c.x, lastY:c.y}); }
                else { activeTouches.set(touch.identifier, {role:'drag', lastX:c.x, lastY:c.y}); }
            }
        }

        function handleTouchMove(e) {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i], st = activeTouches.get(touch.identifier);
                if (!st) continue;
                const c = getTouchCoords(touch);
                if (st.role === 'drag') {
                    // 左右上下都反转：滑动方向与视角移动方向一致
                    cameraYaw += (c.x-st.lastX)*SENSITIVITY;
                    cameraPitch += (c.y-st.lastY)*SENSITIVITY;
                }
                st.lastX = c.x; st.lastY = c.y;
            }
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) activeTouches.delete(e.changedTouches[i].identifier);
        }

        document.addEventListener('pointerlockchange', onPointerLockChange);
        document.addEventListener('mozpointerlockchange', onPointerLockChange);
        document.addEventListener('webkitpointerlockchange', onPointerLockChange);
        canvas.addEventListener('contextmenu', e => { e.preventDefault(); return false; });
        canvas.addEventListener('mousemove', onMouseMove);
        canvas.addEventListener('mousedown', onMouseDown);
        window.addEventListener('keydown', onKeyDown);
        canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
        canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
        canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
        canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });
        canvas.addEventListener('dblclick', e => e.preventDefault());

        resizeCanvas(); targets = []; scoreSpan.textContent = '0'; ammo = MAGAZINE_SIZE;
        requestAnimationFrame(gameLoop);
        window.addEventListener('resize', resizeCanvas);
    });
</script>
</body>
</html>
